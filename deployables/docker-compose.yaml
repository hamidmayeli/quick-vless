name: quick-vless

services:

  # ── Xray VPN core ─────────────────────────────────────────────────────────────
  # No host ports published — Caddy proxies raw TCP to xray:443 on the internal
  # Docker network. Xray is completely unreachable from outside.
  #
  # xray-run.sh runs the config the management app generates (data/xray/config.json)
  # and restarts Xray when the super admin switches the active profile.
  xray:
    image: teddysun/xray:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/xray-run.sh"]
    networks:
      - vpn
    volumes:
      - ./xray-run.sh:/usr/local/bin/xray-run.sh:ro
      - ./xray:/etc/xray/profiles:ro      # one folder per profile, written by install.sh
      - ./data/xray:/etc/xray/runtime     # generated by the app; xray-run.sh writes running.sha256

  # ── Management app ────────────────────────────────────────────────────────────
  # Profiles and the runtime config are mounted at the same paths as in the xray
  # container, so certificate paths inside a profile resolve the same in both.
  app:
    image: hamidmayeli/quick-vless:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - vpn
    depends_on:
      - xray
    volumes:
      - ./data/app:/data                  # users.json, admins.json, settings.json, usage_history/
      - ./xray:/etc/xray/profiles:ro
      - ./data/xray:/etc/xray/runtime
    environment:
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=easy-xray
      - Storage__UsersPath=/data/users.json
      - Storage__AdminsPath=/data/admins.json
      - Storage__UsageHistoryDir=/data/usage_history
      - Storage__SettingsPath=/data/settings.json
      - Xray__ProfilesDir=/etc/xray/profiles
      - Xray__RuntimeDir=/etc/xray/runtime
      - Xray__DefaultProfile=${XRAY_DEFAULT_PROFILE:-vless-reality}
      - Xray__StatsServer=xray:10085

  # ── Caddy — SNI router + reverse proxy ───────────────────────────────────────
  # Built from Dockerfile.caddy (standard caddy + layer4 module).
  # Port 443: routes by SNI — management domain → app, everything else → xray.
  # Port 80:  ACME HTTP-01 challenges + redirect to HTTPS.
  caddy:
    image: hamidmayeli/quick-vless-caddy:latest
    restart: unless-stopped
    networks:
      - vpn
    depends_on:
      - app
      - xray
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
      - ./data/acme:/var/www/certbot:ro
    environment:
      - MANAGEMENT_DOMAIN=${MANAGEMENT_DOMAIN}
      - XRAY_VPN_DOMAIN=${XRAY_VPN_DOMAIN:-disabled.invalid}

networks:
  vpn:
    driver: bridge
