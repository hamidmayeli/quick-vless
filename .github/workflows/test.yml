name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: management-app/backend
        run: dotnet restore OutlineManager.slnx

      - name: Test
        working-directory: management-app/backend
        run: dotnet test OutlineManager.slnx --logger "console;verbosity=normal"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: management-app/frontend/pnpm-lock.yaml

      - name: Install
        working-directory: management-app/frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: management-app/frontend
        run: pnpm lint

      - name: Build
        working-directory: management-app/frontend
        run: pnpm build
