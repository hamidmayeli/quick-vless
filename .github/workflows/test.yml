name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: management-app/backend
        run: dotnet restore OutlineManager.slnx

      - name: Test
        working-directory: management-app/backend
        run: dotnet test OutlineManager.slnx --logger "console;verbosity=normal"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: management-app/frontend/pnpm-lock.yaml

      - name: Install
        working-directory: management-app/frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: management-app/frontend
        run: pnpm lint

      - name: Build
        working-directory: management-app/frontend
        run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: management-app/frontend/dist
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: management-app/frontend/dist

      - name: Copy frontend to wwwroot
        run: |
          mkdir -p management-app/backend/API/wwwroot
          cp -r management-app/frontend/dist/. management-app/backend/API/wwwroot/

      - name: Build backend
        working-directory: management-app/backend
        run: dotnet build OutlineManager.slnx -c Release

      - name: Create fake xray
        run: |
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xray > /dev/null
          sudo chmod +x /usr/local/bin/xray

      - name: Prepare dirs
        run: mkdir -p /tmp/easy-xray-ci/usage_history

      - name: Start backend
        working-directory: management-app/backend
        env:
          ASPNETCORE_HTTP_PORTS: 8080
          ASPNETCORE_ENVIRONMENT: Production
          Jwt__Secret: ci-test-secret-minimum-32-chars-long-x
          Jwt__Issuer: easy-xray
          Storage__UsersPath: /tmp/easy-xray-ci/users.json
          Storage__AdminsPath: /tmp/easy-xray-ci/admins.json
          Storage__UsageHistoryDir: /tmp/easy-xray-ci/usage_history
          Xray__BinaryPath: /usr/local/bin/xray
          Xray__ConfigPath: /tmp/easy-xray-ci/xray.json
          Xray__StatsServer: 127.0.0.1:10085
          Xray__InboundTag: vless-in
          Xray__Host: localhost
          Xray__Port: 443
          Xray__RealityPublicKey: ci-placeholder-public-key
          Xray__RealityShortId: a1b2c3d4
          Xray__Sni: www.microsoft.com
          Xray__Fingerprint: chrome
        run: dotnet run --project API/API.csproj -c Release --no-build --no-launch-profile & echo $! > /tmp/app.pid

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080 && echo "Backend is ready" && exit 0
            echo "Attempt $i/30 failed, waiting 2s..."
            sleep 2
          done
          echo "Backend did not become ready in time" && exit 1

      - name: Install Playwright
        working-directory: management-app/e2e
        run: |
          pnpm install
          pnpm exec playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: management-app/e2e
        env:
          BASE_URL: http://localhost:8080
          CI: 'true'
        run: pnpm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: management-app/e2e/playwright-report/
          retention-days: 7

      - name: Stop backend
        if: always()
        run: kill $(cat /tmp/app.pid) 2>/dev/null || true
