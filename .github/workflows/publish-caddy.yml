name: Publish Caddy

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - '.github/workflows/publish-caddy.yml'
      - 'deployables/Dockerfile.caddy'
  workflow_dispatch:

jobs:
  publish-caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/metadata-action@v6
        id: meta-caddy
        with:
          images: hamidmayeli/quick-vless-caddy
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Caddy image
        uses: docker/build-push-action@v6
        with:
          context: deployables
          file: deployables/Dockerfile.caddy
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-caddy.outputs.tags }}
          labels: ${{ steps.meta-caddy.outputs.labels }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy
